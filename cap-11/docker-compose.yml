version: "3.9"

services:
  # Orquestrador LangGraph
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
      RESEARCH_MCP_URL: http://research-mcp:8001/mcp
      ANALYSIS_MCP_URL: http://analysis-mcp:8002/mcp
      REPORT_MCP_URL: http://report-mcp:8003/mcp
    depends_on:
      research-mcp:
        condition: service_healthy
      analysis-mcp:
        condition: service_healthy
      report-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  # MCP Server - Pesquisa
  research-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: python -m src.agents.researcher.mcp_server.server
    ports:
      - "8001:8001"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      PORT: 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3

  # MCP Server - Analise
  analysis-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: python -m src.agents.analyzer.mcp_server.server
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3

  # MCP Server - Relatorio
  report-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: python -m src.agents.reporter.mcp_server.server
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Langfuse - Observabilidade
  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_secret
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:latest
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_secret@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_HOST:-http://localhost:3000}
      SALT: ${LANGFUSE_SALT}

volumes:
  langfuse_db_data:
